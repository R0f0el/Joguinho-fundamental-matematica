name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar núcleo
        run: dotnet build src/Joguinho.Core
      - name: Compilar site
        run: dotnet build src/Joguinho.Web
      - name: Testes
        run: dotnet test tests/Joguinho.Tests
